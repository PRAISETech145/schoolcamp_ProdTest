{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card text-center p-5">
      <div style="font-size:3rem">⚠️</div>
      <h4 class="fw-bold mt-3">Delete "{{ group.name }}"?</h4>
      <p class="text-muted">This will permanently delete the group, all posts, and remove all members. This cannot be undone.</p>
      <form method="post" class="d-flex gap-3 justify-content-center mt-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Yes, Delete Group</button>
        <a href="{% url 'groups:detail' group.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
