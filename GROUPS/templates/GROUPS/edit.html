{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit {{ group.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header fw-bold"><i class="bi bi-gear"></i> Group Settings – {{ group.name }}</div>
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary flex-grow-1">Save Changes</button>
            <a href="{% url 'groups:detail' group.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
        <hr class="mt-4">
        <div class="text-center">
          <a href="{% url 'groups:delete' group.pk %}" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-trash"></i> Delete This Group
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
