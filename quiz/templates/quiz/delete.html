{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Create Quiz{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><i class="bi bi-plus-circle"></i>Edit Quiz</div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Comfirm Edit</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
