{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 mt-5">
      <div class="text-center mb-4">
        <div style="font-size:3rem">🏕</div>
        <h2 class="fw-bold">Welcome back</h2>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Log In</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'accounts:password_reset' %}" class="text-muted small">Forgot password?</a>
      </div>
      <hr>
      <p class="text-center mb-0">New to SchoolCamp? <a href="{% url 'accounts:register' %">Create account</a></p>
    </div>
  </div>
</div>
{% endblock %}
