{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="fw-bold">Reset Password</h4>
      <p class="text-muted">Enter your email and we'll send you a reset link.</p>
      <form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary w-100">Send Reset Link</button></form>
    </div>
  </div>
</div>
{% endblock %}
